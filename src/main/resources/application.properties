spring.application.name=employee-management

# File-based H2 keeps data between application restarts during local development.
spring.datasource.url=jdbc:h2:file:./data/employee-db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate creates or updates tables from our @Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2's browser-based database console is available at /h2-console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
